# Render Blueprint — https://dashboard.render.com/blueprints
services:
  - type: web
    name: bizfluence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: bizfluence-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://bizfluence.vercel.app
      - key: GEMINI_API_KEY
        value: ""
      - key: HUNTER_API_KEY
        value: ""
      - key: RESEND_API_KEY
        value: ""
      - key: RESEND_FROM_EMAIL
        value: "Bizfluence <onboarding@resend.dev>"
      - key: SEED_ON_STARTUP
        value: "false"

databases:
  - name: bizfluence-db
    plan: free
    databaseName: bizfluence
    user: bizfluence
